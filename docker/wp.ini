; WordPress / Fly runtime php.ini overrides.
;
; The dunglas/frankenphp base image ships with php.ini-production, which
; caps memory_limit at 128M and upload_max_filesize at 2M. Those are too
; tight for WP admin, Gutenberg, and media uploads.
;
; Loaded from /usr/local/etc/php/conf.d/zz-wp.ini so it wins against
; anything the base image dropped in conf.d earlier.

; WP admin / large content payloads.
memory_limit = 512M

; Long-running operations: plugin install, bulk import, cli ops.
max_execution_time = 120
max_input_time = 120
max_input_vars = 4000

; Media uploads — match WordPress's typical large-upload friendly default.
upload_max_filesize = 64M
post_max_size = 64M

; Opcache tuning for WordPress's large codebase (core + plugins).
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; PHP 8.3+ JIT — tracing mode is the recommended default for web workloads.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Production error handling — no display, log to stderr so Fly captures it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Timezone fallback (WP overrides per-site).
date.timezone = UTC
